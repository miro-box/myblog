<style>
 
#loading-mask {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;  
    background-color: var(--body-background, #ffffff);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 99999;
    transition: opacity 0.4s ease, visibility 0.4s ease;
}

 
.loader {
  display: block;
  --height-of-loader: 4px;
   
  --loader-color: var(--accent-color, #0071e2);
  width: 140px;
  height: var(--height-of-loader);
  border-radius: 30px;
   
  background-color: rgba(128, 128, 128, 0.25);
  position: relative;
  margin-bottom: 16px;
}

.loader::before {
  content: "";
  position: absolute;
  background: var(--loader-color);
  top: 0;
  left: 0;
  width: 0%;
  height: 100%;
  border-radius: 30px;
  animation: moving 1s ease-in-out infinite;
}

@keyframes moving {
  50% {
    width: 100%;
  }
  100% {
    width: 0;
    right: 0;
    left: unset;
  }
}

 
.loading-text {
    font-size: 0.85rem;
    color: var(--secondary-text-color, #666);
    font-family: inherit;
    letter-spacing: 2px;
}

 
body.loaded #loading-mask {
    opacity: 0;
    visibility: hidden;
}

<script>
    (() => {
        const ICP_TEXT = '萌ICP备20260690号';
        const ICP_URL = 'https://icp.gov.moe/?keyword=20260690';

         
        const removeLoadingMask = () => {
            document.body.classList.add('loaded');
            const mask = document.getElementById('loading-mask');
            if (mask) setTimeout(() => mask.remove(), 400);
        };

         
        const findReference = (footer) => {
            const walker = document.createTreeWalker(footer, NodeFilter.SHOW_TEXT);
            while (walker.nextNode()) {
                if (walker.currentNode.nodeValue.includes('Hugo')) {
                    let el = walker.currentNode.parentElement;
                    
                    while (el && el !== footer && ['A', 'B', 'STRONG', 'SPAN'].includes(el.tagName)) {
                        el = el.parentElement;
                    }
                    return el;
                }
            }
            return null;
        };

         
        const insertICP = () => {
            if (document.getElementById('icp-badge')) return;

            const footer = document.querySelector('.site-footer');
            if (!footer) return;

            const icp = document.createElement('section');
            icp.id = 'icp-badge';

            const ref = findReference(footer);
            if (ref) {
                const s = getComputedStyle(ref);
                Object.assign(icp.style, {
                    fontSize: s.fontSize,
                    lineHeight: s.lineHeight,
                    color: s.color,
                    fontFamily: s.fontFamily,
                    fontWeight: s.fontWeight,
                    letterSpacing: s.letterSpacing,
                });
            }

            const link = document.createElement('a');
            link.href = ICP_URL;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.textContent = ICP_TEXT;

            icp.appendChild(link);
            footer.appendChild(icp);
        };

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', insertICP, { once: true });
        } else {
            insertICP();
        }

        if (document.readyState === 'complete') {
            removeLoadingMask();
        } else {
            window.addEventListener('load', removeLoadingMask, { once: true });
            setTimeout(removeLoadingMask, 2500);
        }
    })();
</script>
