<!-- ==========================================
  1. 本地双字体声明 (@font-face)
  ========================================== -->
<style>
    /* 声明本地 HarmonyOS Sans (UI/标题/侧边栏) */
    @font-face {
        font-family: 'HarmonyOS Sans';
        src: url('/fonts/HarmonyOS-Sans.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
    }

    /* 声明本地 霞鹜文楷 屏幕阅读版 (正文) */
    @font-face {
        font-family: 'LXGW WenKai';
        src: url('/fonts/LXGWWenKai.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
    }

    /* 定义 CSS 变量 */
    :root {
        --font-modern: "HarmonyOS Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --font-literary: "LXGW WenKai", serif;
        --font-code: Menlo, Monaco, Consolas, "Courier New", monospace;
    }

    /* ==========================================
      2. 字体应用规则
      ========================================== -->
    
    /* 默认正文区域：使用 霞鹜文楷 */
    body, p, article {
        font-family: var(--font-literary) !important;
    }

    /* UI、侧边栏、菜单、按钮及标题：使用 HarmonyOS Sans */
    h1, h2, h3, h4, h5, h6,
    .sidebar,
    .menu,
    .site-name,
    .site-description,
    button,
    input,
    select,
    textarea,
    .article-title,
    .article-subtitle,
    .search-result-title {
        font-family: var(--font-modern) !important;
    }

    /* 代码块：保留等宽字体 */
    code, kbd, pre, samp {
        font-family: var(--font-code) !important;
    }

 /* ==========================================
   自定义二次元 Kuro 鼠标指针
   ========================================== */

/* 1. 全局默认光标 */
body, html {
    cursor: url('/img/pixel-cursor.ani'), auto !important;
}

/* 2. 悬停在链接、按钮上时的光标 */
a, button, [role="button"], .menu a, .sidebar a, .article-title a {
    cursor: url('/img/pixel-pointer.ani'), pointer !important;
}
</style>

<style>
/* 页面加载动画全屏遮罩：电脑与手机端完美居中 */
#loading-mask {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh; /* 适配手机浏览器动态高度，防止底部被地址栏遮挡 */
    background-color: var(--body-background, #ffffff);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 99999;
    transition: opacity 0.4s ease, visibility 0.4s ease;
}

/* Uiverse 进度条动画 (satyamchaudharydev) */
.loader {
  display: block;
  --height-of-loader: 4px;
  /* 自动跟随主题强调色，未定义时默认使用科技蓝 #0071e2 */
  --loader-color: var(--accent-color, #0071e2);
  width: 140px;
  height: var(--height-of-loader);
  border-radius: 30px;
  /* 半透明轨道底色，在白天和黑夜模式下都能完美显示 */
  background-color: rgba(128, 128, 128, 0.25);
  position: relative;
  margin-bottom: 16px;
}

.loader::before {
  content: "";
  position: absolute;
  background: var(--loader-color);
  top: 0;
  left: 0;
  width: 0%;
  height: 100%;
  border-radius: 30px;
  animation: moving 1s ease-in-out infinite;
}

@keyframes moving {
  50% {
    width: 100%;
  }
  100% {
    width: 0;
    right: 0;
    left: unset;
  }
}

/* 博客加载提示字 */
.loading-text {
    font-size: 0.85rem;
    color: var(--secondary-text-color, #666);
    font-family: inherit;
    letter-spacing: 2px;
}

/* 加载完成后的渐隐退场效果 */
body.loaded #loading-mask {
    opacity: 0;
    visibility: hidden;
}
</style>
