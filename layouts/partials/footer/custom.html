<!-- 页面加载动画 -->
<div id="loading-mask">
    <div class="loader"></div>
    <div class="loading-text">昭鸢笺 · 笺册渐启…</div>
</div>

<!-- 构建时由 Hugo 统计文章数和总字数 -->
{{ $posts := where .Site.RegularPages "Section" "posts" }}
{{ $words := 0 }}
{{ range $posts }}{{ $words = add $words .WordCount }}{{ end }}
<div id="site-stats" hidden data-posts="{{ len $posts }}" data-words="{{ $words }}"></div>

<style>
    #site-footer-extra a {
        color: inherit;
        text-decoration: none;
        transition: color 0.2s ease;
    }

    #site-footer-extra a:hover {
        color: var(--accent-color);
    }
</style>

<script>
    (() => {
        /* ===== 配置 ===== */
        const START_TIME = new Date('2023-03-05T00:00:00+08:00'); // 博客上线时间
        const ICP_TEXT = '萌ICP备20260690号';
        const ICP_URL = 'https://icp.gov.moe/?keyword=20260690';
        const BUSUANZI_SRC = 'https://events.vercount.one/js';

        /* ===== 加载动画 ===== */
        const removeLoadingMask = () => {
            document.body.classList.add('loaded');
            const mask = document.getElementById('loading-mask');
            if (mask) setTimeout(() => mask.remove(), 400);
        };

        /* ===== 样式参照：「使用 Hugo 构建」所在行 ===== */
        const findReference = (footer) => {
            const walker = document.createTreeWalker(footer, NodeFilter.SHOW_TEXT);
            while (walker.nextNode()) {
                if (walker.currentNode.nodeValue.includes('Hugo')) {
                    let el = walker.currentNode.parentElement;
                    while (el && el !== footer && ['A', 'B', 'STRONG', 'SPAN'].includes(el.tagName)) {
                        el = el.parentElement;
                    }
                    return el;
                }
            }
            return null;
        };

        /* ===== 运行时间 ===== */
        const formatUptime = () => {
            const diff = Math.max(0, Date.now() - START_TIME.getTime());
            const days = Math.floor(diff / 864e5);
            const hours = Math.floor(diff % 864e5 / 36e5);
            const minutes = Math.floor(diff % 36e5 / 6e4);
            return `本博客已稳定运行 ${days} 天 ${hours} 小时 ${minutes} 分钟`;
        };

        /* ===== 加载不蒜子，超时则显示 -- ===== */
        const loadBusuanzi = () => {
            const pv = document.getElementById('busuanzi_value_site_pv');
            const giveUp = () => {
                if (pv && !/\d/.test(pv.textContent)) pv.textContent = '--';
            };

            const script = document.createElement('script');
            script.async = true;
            script.src = BUSUANZI_SRC;
            script.onerror = giveUp;
            document.head.appendChild(script);

            setTimeout(giveUp, 6000);
        };

        /* ===== 插入页脚内容 ===== */
        const insertFooterExtra = () => {
            if (document.getElementById('site-footer-extra')) return;

            const footer = document.querySelector('.site-footer');
            if (!footer) return;

            const stats = document.getElementById('site-stats');
            const posts = stats ? Number(stats.dataset.posts) : 0;
            const words = stats ? Number(stats.dataset.words) : 0;
            const wordsK = (words / 1000).toFixed(1).replace(/\.0$/, '');

            const wrap = document.createElement('div');
            wrap.id = 'site-footer-extra';

            const ref = findReference(footer);
            const refStyle = ref ? getComputedStyle(ref) : null;

            const addLine = (html, id) => {
                const line = document.createElement('section');
                if (id) line.id = id;
                if (refStyle) {
                    Object.assign(line.style, {
                        fontSize: refStyle.fontSize,
                        lineHeight: refStyle.lineHeight,
                        color: refStyle.color,
                        fontFamily: refStyle.fontFamily,
                        fontWeight: refStyle.fontWeight,
                        letterSpacing: refStyle.letterSpacing,
                    });
                }
                line.innerHTML = html;
                wrap.appendChild(line);
                return line;
            };

            // 第 1 行：运行时间
            const uptimeLine = addLine(formatUptime(), 'uptime-line');

            // 第 2 行：文章数 · 字数 · 访问量
            addLine(
                `共发表 ${posts} 篇文章 · 总计 ${wordsK} k 字 · ` +
                '<span id="busuanzi_container_site_pv">本站总访问量 ' +
                '<span id="busuanzi_value_site_pv">…</span> 次</span>'
            );

            // 第 3 行：备案号
            addLine(`<a href="${ICP_URL}" target="_blank" rel="noopener noreferrer">${ICP_TEXT}</a>`, 'icp-badge');

            footer.appendChild(wrap);

            setInterval(() => { uptimeLine.textContent = formatUptime(); }, 30000);

            loadBusuanzi();
        };

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', insertFooterExtra, { once: true });
        } else {
            insertFooterExtra();
        }

        if (document.readyState === 'complete') {
            removeLoadingMask();
        } else {
            window.addEventListener('load', removeLoadingMask, { once: true });
            setTimeout(removeLoadingMask, 2500);
        }
    })();
</script>

<script>
(function() {
    function updateReadingProgress() {
        const bar = document.querySelector('.reading-progress');
        // 将计算基准从正文改为整个文章容器（包含顶部的封面图、标题等）
        const container = document.querySelector('.main-article');
        if (!bar || !container) return;
        
        const rect = container.getBoundingClientRect();
        const scrollTop = window.scrollY || document.documentElement.scrollTop;
        const start = scrollTop + rect.top;
        const total = Math.max(container.scrollHeight - window.innerHeight * 0.55, 1);
        const current = Math.min(Math.max(scrollTop - start, 0), total);
        bar.style.transform = `scaleX(${current / total})`;
    }

    function setupReadingProgress() {
        const existing = document.querySelector('.reading-progress');
        const article = document.querySelector('.article-page .main-article');
        
        if (!article) {
            existing?.remove();
            window.removeEventListener('scroll', updateReadingProgress);
            window.removeEventListener('resize', updateReadingProgress);
            return;
        }
        
        const bar = existing || document.createElement('div');
        bar.className = 'reading-progress';
        bar.setAttribute('aria-hidden', 'true');
        if (!existing) document.body.appendChild(bar);

        window.removeEventListener('scroll', updateReadingProgress);
        window.removeEventListener('resize', updateReadingProgress);
        window.addEventListener('scroll', updateReadingProgress);
        window.addEventListener('resize', updateReadingProgress);
        
        updateReadingProgress();
    }

    // 页面初次加载时执行
    document.addEventListener('DOMContentLoaded', setupReadingProgress);
    
    // 适配 Stack 主题的 Swup PJAX 无刷新跳转，换页后自动重新挂载
    document.addEventListener('swup:contentReplaced', setupReadingProgress);
})();
</script>

<script>
  // 自动将页脚版权或副标题植入“昭鸢笺”专属印记
  document.addEventListener("DOMContentLoaded", () => {
    const footerCopyright = document.querySelector('.site-footer .copyright');
    if (footerCopyright && !footerCopyright.innerHTML.includes('昭鸢笺')) {
      // 在原有的版权后面或者中间温和嵌入
      footerCopyright.innerHTML = `&copy; ${new Date().getFullYear()} 昭鸢笺 &middot; 纸鸢轻飞`;
    }
  });
</script>

<!-- 页脚版权与署名精简重构 -->
<script>
  document.addEventListener("DOMContentLoaded", () => {
    // 查找 Stack 主题默认渲染的页脚版权容器
    const copyrightEl = document.querySelector('.site-footer .copyright') || document.querySelector('footer .copyright');
    
    if (copyrightEl) {
      // 替换为“昭鸢笺”专属纯净版权落款
      copyrightEl.innerHTML = `&copy; 2023–2026 <strong>昭鸢笺</strong> &middot; 纸鸢轻飞远`;
    }
    
    // 如果想要隐藏主题默认的 "Powered by Hugo & Stack" 等冗余外链字样
    const poweredByEl = document.querySelector('.site-footer .powerby') || document.querySelector('footer .powerby');
    if (poweredByEl) {
      poweredByEl.style.display = 'none';
    }
  });
</script>
