name: Deploy to HK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.168.0'
          extended: true
      - name: Build
        run: hugo --minify --baseURL "${{ vars.SITE_URL }}"
      - name: SSH setup
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.HK_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.HK_PORT }}" "${{ secrets.HK_HOST }}" >> ~/.ssh/known_hosts
      - name: Sync to server
        run: rsync -az --delete -e "ssh -p ${{ secrets.HK_PORT }}" public/ deploy@${{ secrets.HK_HOST }}:/var/www/blog/
