baseURL = "https://blog.mibase.top/"
title = "昭鸢笺"
theme = "hugo-theme-reimu"
languageCode = "zh-CN"
defaultContentLanguage = "zh-CN"
hasCJKLanguage = true

[pagination]
  pagerSize = 6

[permalinks]
  posts = "/p/:slug/"
  page = "/:slug/"

[languages.zh-CN]
  languageName = "简体中文"
  weight = 1
  hasCJKLanguage = true

[services.googleAnalytics]
  id = "G-NN33GXTYKM"

[markup.goldmark.renderer]
  unsafe = true

[markup.goldmark.extensions.passthrough]
  enable = true
  delimiters.block = [["\\[", "\\]"], ["$$", "$$"]]
  delimiters.inline = [["\\(", "\\)"], ["$", "$"]]

[markup.highlight]
  guessSyntax = true
  noClasses = false

[markup.tableOfContents]
  startLevel = 2
  endLevel = 4

[outputs]
  home = ["Algolia", "HTML", "RSS"]

[outputFormats.Algolia]
  baseName = "algolia"
  isPlainText = true
  mediaType = "application/json"
  notAlternative = true