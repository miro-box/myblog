  body_begin: # Inject code snippet right after <body>
  body_end: |-
    <script>
    (function () {
      var els = document.querySelectorAll('.twikoo-comment-count');
      if (!els.length) return;
      var envId = 'https://comments.mibase.top/.netlify/functions/twikoo';
      function run() {
        if (!window.twikoo || !twikoo.getCommentsCount) return false;
        twikoo.getCommentsCount({
          envId: envId,
          urls: [location.pathname],
          includeReply: false
        }).then(function (res) {
          els.forEach(function (el) { el.innerText = res[0].count; });
        }).catch(function () {});
        return true;
      }
      var n = 0;
      var t = setInterval(function () {
        if (run() || ++n > 40) clearInterval(t);
      }, 500);
      setTimeout(run, 3000);
      setTimeout(run, 6000);
    })();
    </script>
    <script>
    (function () {
      var p = location.pathname.replace(/\/index\.html$/, '').replace(/\/+$/, '') || '/';
      document.querySelectorAll('.main-nav-link-wrap').forEach(function (a) {
        var h = a.getAttribute('href') || '';
        try { h = new URL(h, location.href).pathname; } catch (e) {}
        h = h.replace(/\/+$/, '') || '/';
        if (h === p || (h !== '/' && p.indexOf(h + '/') === 0)) a.classList.add('nav-current');
      });
    })();
    </script>
    <style>
    #read-progress { position: fixed; top: 0; left: 0; height: 3px; width: 100%; z-index: 9999;
      transform: scaleX(0); transform-origin: left; pointer-events: none;
      background: linear-gradient(90deg, #2289a0, #7bc5d5 60%, #c9a45c); }
    </style>
    <script>
    (function () {
      var art = document.querySelector('.article-entry');
      if (!art || !document.querySelector('#article-nav, .article-footer, #comments')) return;
      var bar = document.createElement('div');
      bar.id = 'read-progress';
      document.body.appendChild(bar);
      var ticking = false;
      function update() {
        ticking = false;
        var r = art.getBoundingClientRect();
        var span = r.height - window.innerHeight * 0.6;
        var p = span > 0 ? Math.min(1, Math.max(0, -r.top / span)) : 0;
        bar.style.transform = 'scaleX(' + p + ')';
      }
      function onScroll() { if (!ticking) { ticking = true; requestAnimationFrame(update); } }
      window.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('resize', onScroll);
      update();
    })();
    </script>
