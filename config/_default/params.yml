########################################
# Experimental features
########################################

# Inject code snippet
# Make sure your code snippet is safeHTML
injector:
  head_begin: # Inject code snippet right after <head>
  head_end: |-
    
    <style>
    #loader, #loader * { cursor: url(data:image/png;base64,), auto !important; }
    /* 加载动画：图标轻轻浮动，文字呼吸，金色流光细线，背景虚化 */
    #loader .loading-bg { backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    #loader .spinner-box .loading-taichi { opacity: 1; }
    #loader .spinner-box .loading-taichi img {
      animation: loader-float 2.6s ease-in-out infinite;
      filter: drop-shadow(0 8px 16px rgba(34, 137, 160, .28));
    }
    #loader .spinner-box .loading-word {
      animation: loader-breathe 2.2s ease-in-out infinite;
    }
    #loader .spinner-box .loading-word::after {
      content: ""; position: absolute; left: 50%; bottom: -16px;
      width: 72px; height: 2px; transform: translateX(-50%); border-radius: 2px;
      background: linear-gradient(90deg, transparent, #c9a45c, transparent);
      background-size: 200% 100%; animation: loader-shine 1.6s linear infinite;
    }
    @keyframes loader-float {
      0%, 100% { transform: translateY(0) rotate(-2deg) scale(1); }
      50% { transform: translateY(-10px) rotate(2deg) scale(1.05); }
    }
    @keyframes loader-breathe { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    @keyframes loader-shine { from { background-position: 200% 0; } to { background-position: -200% 0; } }
    @media (prefers-reduced-motion: reduce) {
      #loader .spinner-box .loading-taichi img,
      #loader .spinner-box .loading-word,
      #loader .spinner-box .loading-word::after { animation: none; }
    }
    /* 加载动画文字：内嵌一个只有几个字的小字体，第一帧就是霞鹜文楷，不再先闪一下系统字体 */
    @font-face {
      font-family: 'WenKai Loader'; font-style: normal; font-weight: 400; font-display: block;
      src: url(data:font/woff;base64,) format('woff');
    }
    #loader .spinner-box .loading-word { font-family: 'WenKai Loader', 'LXGW WenKai Sub', serif; }
    /* 首页大标题与副标题 */
    #header-title::before {
      content: ""; position: absolute; left: 50%; top: 50%;
      width: min(92%, 640px); height: 190px; transform: translate(-50%, -50%);
      background: radial-gradient(ellipse at center, rgba(8, 40, 52, .38), transparent 70%);
      pointer-events: none; z-index: -1;
    }
    #logo { text-shadow: 0 2px 16px rgba(8, 40, 52, .75), 0 0 3px rgba(8, 40, 52, .55); letter-spacing: 4px; }
    #header-title:has(#subtitle) #logo { font-size: 44px; letter-spacing: 14px; padding-left: 14px; }
    #header-title:has(#subtitle) #logo::after {
      content: ""; display: block; width: 48px; height: 2px; margin: 12px auto 0;
      background: #c9a45c; border-radius: 2px; box-shadow: 0 0 10px rgba(201, 164, 92, .6);
    }
    #subtitle {
