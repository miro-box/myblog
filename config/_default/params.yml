    #comments .twikoo .tk-tag,
    #comments .twikoo .tk-tag-green,
    #comments .twikoo .tk-tag-blue,
    #comments .twikoo .tk-tag-yellow,
    #comments .twikoo .tk-tag-red {
        padding: 0 6px;
        border: 1px solid currentColor;
        border-radius: 6px;
        background: transparent;
        font-size: 12px;
        line-height: 18px;
    }

    #comments .twikoo .tk-tag {
        color: var(--tk-accent);
    }

    #comments .twikoo .tk-time,
    #comments .twikoo .tk-extras,
    #comments .twikoo .tk-extra {
        color: var(--tk-muted);
    }

    #comments .twikoo .tk-time {
        font-size: 12.5px;
    }

    #comments .twikoo .tk-extras {
        font-size: 12.5px;
    }

    /* ---------- 正文：就是普通文字，不套背景 ---------- */
    #comments .twikoo .tk-content {
        margin-top: 6px;
        font-size: 15px;
        line-height: 1.8;
        color: var(--color-default);
    }

    #comments .twikoo .tk-replies .tk-content {
        font-size: 14px;
    }

    #comments .twikoo .tk-content a {
        color: var(--color-link);
        text-decoration: none;
        word-break: break-word;
    }

    #comments .twikoo .tk-content a:hover {
        text-decoration: underline;
    }

    #comments .twikoo .tk-content code:not(pre code) {
        padding: 1px 4px;
        border-radius: 6px;
        background: var(--color-code-background);
        color: var(--color-link);
    }

    #comments .twikoo .tk-content blockquote {
        margin: 10px 0;
        padding: 2px 12px;
        border-left: 3px solid var(--red-3);
        border-radius: 0 var(--tk-radius) var(--tk-radius) 0;
        background: var(--red-5-5);
        color: var(--tk-muted);
    }

    #comments .twikoo .tk-content img {
        max-width: min(100%, 320px);
        max-height: 320px;
        border-radius: var(--tk-radius);
    }

    #comments .twikoo .tk-owo-emotion {
        width: 1.9em;
    }

    /* ---------- 回复 / 点赞：纯文字，hover 变主题色 ---------- */
    #comments .twikoo .tk-actions {
        margin-left: 12px;
        font-size: 13px;
    }

    #comments .twikoo .tk-action-link,
    #comments .twikoo .tk-actions button {
        color: var(--tk-muted);
        font-size: 13px;
        cursor: var(--cursor-pointer, pointer) !important;
    }

    #comments .twikoo .tk-action-icon {
        color: inherit;
    }

    #comments .twikoo .tk-action-link:hover,
    #comments .twikoo .tk-actions button:hover {
        color: var(--tk-accent);
    }

    #comments .twikoo .tk-action-count {
        font-size: 12px;
    }

    /* 触屏没有 hover，操作按钮直接显示出来 */
    @media (hover: none) {
        #comments .twikoo .tk-actions {
            display: inline;
        }
    }

    /* ---------- 展开更多：一条安静的居中文案 ---------- */
    #comments .twikoo .tk-expand {
        padding: 10px 0;
        background: transparent;
        color: var(--tk-muted);
        font-size: 13px;
    }

    #comments .twikoo .tk-expand:hover,
    #comments .twikoo .tk-expand:active {
        background: transparent;
        color: var(--tk-accent);
    }

    /* ---------- 暂无评论 / 分页 / Powered by ---------- */
    #comments .twikoo .tk-comments-no {
        padding: 18px 0;
        color: var(--tk-muted);
        font-size: 14px;
    }

    #comments .twikoo .tk-pagination {
        margin-top: 14px;
        font-size: 13px;
    }

    #comments .twikoo .tk-pagination-pager {
        border-radius: var(--tk-radius);
        color: var(--color-default);
        cursor: var(--cursor-pointer, pointer) !important;
    }

    #comments .twikoo .tk-pagination-pager:hover {
        background: var(--tk-accent-soft);
        color: var(--tk-accent);
    }

    #comments .twikoo .tk-pagination-pager.__current {
        background: var(--tk-accent);
        color: #fff;
    }

    #comments .twikoo .tk-pagination .tk-input__inner {
        height: 30px;
        padding: 0;
        line-height: 30px;
        text-align: center;
    }

    #comments .twikoo .tk-footer {
        margin-top: 14px;
        color: var(--tk-muted);
        font-size: 12px;
    }

    #comments .twikoo .tk-footer a {
        color: var(--tk-muted);
    }

    #comments .twikoo .tk-footer a:hover {
        color: var(--tk-accent);
    }

    /* ---------- 表情面板（OwO）：细边框，格子跟内容走，文字不折断 ---------- */
    /* 面板挂到整个提交框上（Twikoo 默认挂在缩进了 3.5rem 的按钮行上，窄屏会少掉一截宽度） */
    #comments .twikoo .tk-submit {
        position: relative;
    }

    #comments .twikoo .OwO .OwO-body {
        top: calc(100% + 12px);
        left: 0;
        right: auto;
        width: min(100%, 460px);
        max-width: 100%;
        color: var(--color-default);
        background: var(--color-wrap);
        border: 1px solid var(--tk-line);
        border-radius: var(--tk-radius);
        box-shadow: var(--shadow-card);
        overflow: hidden;
    }

    #comments .twikoo .OwO .OwO-logo {
        width: 1.25em;
        height: 1.25em;
        line-height: 0;
    }

    #comments .twikoo .OwO .OwO-items {
        margin: 0;
        padding: 8px 6px 6px 8px;
        overflow: auto;
        overscroll-behavior: contain;
        scrollbar-width: thin;
        scrollbar-color: var(--tk-line-strong) transparent;
    }

    /* 用 flex 排格子：每个格子保持自身宽度，放不下就整体换行，绝不被压扁 */
    #comments .twikoo .OwO .OwO-items-show {
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
        justify-content: flex-start;
        gap: 2px 4px;
    }

    /* 关键：颜文字不许在格子中间折断，放不下就整体换行 */
    #comments .twikoo .OwO .OwO-items .OwO-item {
        flex: 0 0 auto;
        padding: 4px 7px;
        border-radius: 6px;
        background: transparent;
        box-shadow: none;
        color: var(--color-default);
        font-size: 13px;
        line-height: 1.6;
        white-space: nowrap;
        word-break: keep-all;
        overflow-wrap: normal;
        vertical-align: middle;
        cursor: var(--cursor-pointer, pointer) !important;
    }

    #comments .twikoo .OwO .OwO-items .OwO-item:hover {
        background: var(--tk-accent-soft);
    }

    /* Twikoo 把「颜文字」也当成图片表情，给了 width:14% 的格子宽度，
       纯文字格子被压扁后文字会互相压在一起；所以没有 img 的格子把宽度还给内容 */
    /* 回复框左边是父评论的头像栏，把面板往左挪一列（保守按 1.6rem 头像算），宽度补回来 */
    #comments .twikoo .tk-comment .tk-submit .OwO .OwO-body {
        left: -2.6rem;
        width: min(calc(100% + 2.6rem), 460px);
    }

    #comments .twikoo .OwO .OwO-items .OwO-item:not(:has(img)) {
        width: auto;
    }

    /* 真正的图片表情（Emoji / Bilibili 之类）才用格子宽度：桌面 8 个一行 */
    #comments .twikoo .OwO .OwO-items .OwO-item:has(img) {
        width: 12.5%;
        padding: 4px 2px;
    }

    #comments .twikoo .OwO .OwO-items .OwO-item img,
    #comments .twikoo .OwO .OwO-item img.tk-owo-emotion {
        width: 1.9em;
        max-width: 100%;
        height: auto;
        border-radius: 4px;
        vertical-align: middle;
    }

    /* 分类栏：没底色的文字标签，当前分类用主题色下划线 */
    #comments .twikoo .OwO .OwO-bar {
        border-top: 1px solid var(--tk-line);
        background: transparent;
    }

    #comments .twikoo .OwO .OwO-packages {
        display: flex;
        flex-wrap: wrap;
        gap: 2px;
        padding: 4px;
    }

    #comments .twikoo .OwO .OwO-packages li {
        margin: 0;
        padding: 3px 12px;
        border-radius: 6px;
        background: transparent;
        color: var(--tk-muted);
        font-size: 13px;
        line-height: 24px;
        cursor: var(--cursor-pointer, pointer) !important;
    }

    #comments .twikoo .OwO .OwO-packages li:hover {
        background: transparent;
        color: var(--tk-accent);
    }

    #comments .twikoo .OwO .OwO-packages .OwO-package-active {
        background: transparent;
        color: var(--tk-accent);
        box-shadow: inset 0 -2px 0 var(--tk-accent);
        transition: none;
    }

    #comments .twikoo .OwO .OwO-items::-webkit-scrollbar {
        width: 6px;
        height: 6px;
    }

    #comments .twikoo .OwO .OwO-items::-webkit-scrollbar-thumb {
        background: var(--tk-line-strong);
        border-radius: 3px;
    }

    #comments .twikoo .tk-owo-preview-panel {
        border-color: var(--tk-line);
        border-radius: var(--tk-radius);
        background: var(--color-wrap);
        box-shadow: var(--shadow-card);
    }

    #comments .twikoo .tk-loading-spinner .path {
        stroke: var(--tk-accent);
    }

    /* ---------- 深色模式：头像和表情不要被主题的 brightness(70%) 压暗 ---------- */
    [data-theme="dark"] #comments .twikoo img {
        filter: none;
    }

    /* ---------- 管理面板（评论管理 / 登录）：深色遮罩上保持浅色可读 ---------- */
    #comments .twikoo .tk-admin .tk-input__inner,
    #comments .twikoo .tk-admin .tk-input-group__prepend {
        color: #fff;
        background: rgba(0, 0, 0, 0.3);
        border-color: rgba(255, 255, 255, 0.35);
    }

    #comments .twikoo .tk-admin .tk-input__inner:focus {
        background: rgba(0, 0, 0, 0.3);
        border-color: #fff;
        box-shadow: none;
    }

    #comments .twikoo .tk-admin .tk-button {
        color: #fff;
        background: rgba(255, 255, 255, 0.06);
        border-color: rgba(255, 255, 255, 0.35);
    }

    #comments .twikoo .tk-admin .tk-button:hover {
        color: #fff;
        background: rgba(255, 255, 255, 0.16);
        border-color: rgba(255, 255, 255, 0.55);
    }

    #comments .twikoo .tk-admin .tk-button--primary {
        color: #fff;
        background: var(--tk-accent);
        border-color: var(--tk-accent);
    }

    /* ---------- 手机端：留白小一点 ---------- */
    @media screen and (max-width: 767px) {
        #comments .twikoo .tk-comments-title {
            font-size: 16px;
        }

        #comments .twikoo .tk-comment {
            padding: 14px 0;
        }

        #comments .twikoo .tk-textarea .tk-input__inner {
            min-height: 104px;
        }

        #comments .twikoo .OwO .OwO-body {
            top: calc(100% + 8px);
        }

        #comments .twikoo .OwO .OwO-items .OwO-item:has(img) {
            width: 20%;
        }
    }
    .reimu-bg { opacity: 0.85; }
