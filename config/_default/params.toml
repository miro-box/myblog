mainSections   = ["posts"]
rssFullContent = true
favicon        = "img/favicon.png"

[footer]
    since = 2023

[sidebar]
    emoji    = ""
    subtitle = "Lorem ipsum dolor sit amet, consectetur adipiscing elit."
    avatar   = "img/miro.jpg"

[article]
    [article.license]
        enabled = true
        default = "Licensed under [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/)"

[widgets]
    homepage = [
        { type = "search" },
        { type = "categories", params = { limit = 10 } },
        { type = "tag-cloud", params = { limit = 10 } },
        { type = "archives", params = { limit = 5 } },
    ]
    page     = [{ type = "toc" }]

[comments]
    enabled = true
    provider = "twikoo"

    [comments.twikoo]
        envId = "https://comments.mibase.top/.netlify/functions/twikoo"
        region = ""
        path = ""
        lang = "zh-CN"

# GDPR Cookie Consent Configuration
# When enabled, analytics and functional cookies require user consent
[cookies]
    enabled = false

    [cookies.categories]
        analytics  = true
        functional = true
